; PHP's CLI in the image: every PHP process but FrankenPHP's server -- the
; one-off commands, `tinvar serve` and its tethers, the queue worker and the
; scheduler (ADR 0063). FrankenPHP's static binary reads no php.ini; its
; settings are the Caddyfile's.
;
; What production needs said, where PHP's own default is not it. Everything
; else is PHP's default, as it is under FrankenPHP.

; An error goes to standard error, as a log line -- the container's log --
; and never to standard output, which a command's caller may be reading.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Arguments are left out of a stack trace, so a secret passed to a function
; that throws is never written to the log with it.
zend.exception_ignore_args = On

; No code is ever read from a URL. allow_url_fopen stays on: the queue
; worker publishes to the live hub (Tinvar\Live\Mercure) and exports spans
; (OtlpHttpExporter) over PHP's http:// wrapper, to addresses the
; application's own settings name.
allow_url_include = Off

; A CLI sends no header, but nothing says which PHP this is anywhere.
expose_php = Off
