# Render, written by `php tinvar deploy:init render` (ADR 0157 in the
# framework's repository). No secret is in this file: Render asks for
# each `sync: false` variable when the Blueprint is applied.
services:
  - type: web
    name: my-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    # FrankenPHP finishes its requests (up to 10 s), then the renderers
    # drain theirs (up to 75 s).
    maxShutdownDelaySeconds: 120
    # No healthCheckPath: Render's checks send no Authorization header,
    # and /_health answers only the probe token. Render waits for the
    # port instead; point a monitor of your own at the probes.
    # The SQLite database, and the files kept beside it: one instance,
    # since a disk is one instance's.
    disk:
      name: data
      mountPath: /var/lib/app/data
      sizeGB: 1
    # No TINVAR_TRUSTED_PROXIES: Render's edge cannot send TINVAR_TRUSTED_PROXY_SECRET,
    # and a range is refused without it (ADR 0134), so every visitor is counted as the
    # edge's one address. Put Cloudflare in front (deploy:init --front=cloudflare) to
    # count each visitor apart.
    envVars:
      - key: TINVAR_APP_DOMAIN
        value: "https://my-app.onrender.com"
      - key: APP_URL
        value: "https://my-app.onrender.com"
      - key: TINVAR_APP_KEY
        sync: false
      - key: TINVAR_PROBE_TOKEN
        sync: false
