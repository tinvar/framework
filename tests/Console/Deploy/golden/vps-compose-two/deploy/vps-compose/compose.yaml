# my-app on a VPS, written by `bin/tinvar deploy:init vps-compose` (ADR
# 0150 in the framework's repository). From the project's root, as root,
# since the secrets are root's files:
#
#   sudo docker compose -f deploy/vps-compose/compose.yaml up -d --build
#
# No secret is in this file: they are in /etc/my-app/app.env and
# proxy.env, mode 0600, written by the steps deploy:init printed.
name: my-app

x-locked: &locked
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  # TLS for app.example.com, and the proof the app takes it for its proxy by.
  caddy:
    image: caddy:2
    env_file: /etc/my-app/proxy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    tmpfs:
      - /config
    cap_add: [NET_BIND_SERVICE]
    depends_on: [app]
    <<: *locked

  # The renderers, from an image of their own, with no network at all:
  # they answer on their sockets alone (ADR 0071).
  renderers:
    build:
      context: ../..
      target: pod-renderer
    image: my-app-renderer:latest
    network_mode: none
    volumes:
      - sockets:/run/tinvar-renderer
    stop_grace_period: 80s
    <<: *locked

  app:
    build:
      context: ../..
      target: pod-php
    image: my-app-php:latest
    # The socket group, whose sockets the renderers share with it alone.
    group_add: ["10003"]
    env_file: /etc/my-app/app.env
    environment:
      TINVAR_TRUSTED_PROXIES: "10.213.92.0/24"
      TINVAR_APP_DOMAIN: "https://app.example.com"
      TINVAR_PROBE_TRUST_LOOPBACK: "0"
      APP_DATABASE_DRIVER: "postgres"
      APP_DATABASE_HOST: "db.internal"
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_NAME: "my_app"
      APP_DATABASE_USER: "my_app"
      TINVAR_MAIL_PROVIDER: "smtp"
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - sockets:/run/tinvar-renderer:ro
    depends_on:
      renderers:
        condition: service_healthy
    stop_grace_period: 120s
    <<: *locked

# Pinned, so TINVAR_TRUSTED_PROXIES can name the range Caddy connects
# from; the secret tells Caddy apart from anything else in it.
networks:
  default:
    ipam:
      config:
        - subnet: 10.213.92.0/24

volumes:
  sockets:
  caddy-data:
