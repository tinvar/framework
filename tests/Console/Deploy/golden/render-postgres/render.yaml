# Render, written by `bin/tinvar deploy:init render` (ADR 0150 in the
# framework's repository). No secret is in this file: Render asks for
# each `sync: false` variable when the Blueprint is applied.
services:
  - type: web
    name: my-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    # FrankenPHP finishes its requests (up to 10 s), then the renderers
    # drain theirs (up to 75 s).
    maxShutdownDelaySeconds: 120
    # No healthCheckPath: Render's checks send no Authorization header,
    # and /_health answers only the probe token. Render waits for the
    # port instead; point a monitor of your own at the probes.

    # Render's load balancer, inside 10.0.0.0/8, and Cloudflare in front of
    # it (cloudflare.com/ips): neither sends a header of ours, so no
    # TINVAR_TRUSTED_PROXY_SECRET.
    envVars:
      - key: TINVAR_TRUSTED_PROXIES
        value: "10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - key: TINVAR_APP_DOMAIN
        value: "https://my-app.onrender.com"
      - key: TINVAR_APP_KEY
        sync: false
      - key: TINVAR_PROBE_TOKEN
        sync: false
      - key: APP_DATABASE_DRIVER
        value: "postgres"
      - key: APP_DATABASE_HOST
        fromDatabase:
          name: my-app-db
          property: host
      - key: APP_DATABASE_PORT
        fromDatabase:
          name: my-app-db
          property: port
      - key: APP_DATABASE_NAME
        fromDatabase:
          name: my-app-db
          property: database
      - key: APP_DATABASE_USER
        fromDatabase:
          name: my-app-db
          property: user
      - key: APP_DATABASE_PASSWORD
        fromDatabase:
          name: my-app-db
          property: password
      - key: TINVAR_MAIL_PROVIDER
        value: "postmark"
      - key: TINVAR_POSTMARK_TOKEN
        sync: false

databases:
  - name: my-app-db
    databaseName: my_app
    user: my_app
    plan: basic-256mb
