# Render, written by `bin/tinvar deploy:init render` (ADR 0157 in the
# framework's repository). No secret is in this file: Render asks for
# each `sync: false` variable when the Blueprint is applied.
services:
  - type: web
    name: my-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    # FrankenPHP finishes its requests (up to 10 s), then the renderers
    # drain theirs (up to 75 s).
    maxShutdownDelaySeconds: 120
    # No healthCheckPath: Render's checks send no Authorization header,
    # and /_health answers only the probe token. Render waits for the
    # port instead; point a monitor of your own at the probes.
    # Render's edge, each request proven by TINVAR_TRUSTED_PROXY_SECRET, which
    # Cloudflare sends in X-Tinvar-Proxy. The client is the address Cloudflare names in
    # X-Tinvar-Client, its ip.src, and the host the one it names in X-Tinvar-Host, its
    # http.host: X-Forwarded-For and X-Forwarded-Host, which a Cloudflare Worker writes
    # as it likes, are not read, so no Cloudflare range is pinned.
    envVars:
      - key: TINVAR_TRUSTED_PROXIES
        value: "10.0.0.0/8"
      - key: TINVAR_TRUSTED_PROXY_CLIENT
        value: "header"
      - key: TINVAR_APP_DOMAIN
        value: "https://my-app.onrender.com"
      - key: TINVAR_APP_KEY
        sync: false
      - key: TINVAR_PROBE_TOKEN
        sync: false
      - key: TINVAR_TRUSTED_PROXY_SECRET
        sync: false
      - key: APP_DATABASE_DRIVER
        value: "postgres"
      - key: APP_DATABASE_HOST
        fromDatabase:
          name: my-app-db
          property: host
      - key: APP_DATABASE_PORT
        fromDatabase:
          name: my-app-db
          property: port
      - key: APP_DATABASE_NAME
        fromDatabase:
          name: my-app-db
          property: database
      - key: APP_DATABASE_USER
        fromDatabase:
          name: my-app-db
          property: user
      - key: APP_DATABASE_PASSWORD
        fromDatabase:
          name: my-app-db
          property: password
      - key: TINVAR_MAIL_PROVIDER
        value: "postmark"
      - key: TINVAR_POSTMARK_TOKEN
        sync: false

databases:
  - name: my-app-db
    databaseName: my_app
    user: my_app
    plan: basic-256mb
